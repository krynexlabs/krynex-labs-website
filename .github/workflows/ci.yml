name: Production CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Lint, Typecheck & Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint Audit
        run: npm run lint

      - name: Static Type Validation (TypeScript)
        run: npx tsc --noEmit

      - name: Critical Business & Security Regression Tests
        run: npm test

      - name: Next.js Production Build Verification
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
